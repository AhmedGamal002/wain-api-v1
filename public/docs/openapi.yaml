openapi: 3.0.3
info:
  title: 'Wain API'
  description: 'API تطبيق وين (Wain): الأماكن والتصنيفات والحساب. العقد بين الـ backend والموبايل.'
  version: 1.0.0
servers:
  -
    url: 'http://localhost'
tags:
  -
    name: Auth
    description: ''
  -
    name: Config
    description: ''
  -
    name: Categories
    description: ''
  -
    name: Attributes
    description: ''
  -
    name: Areas
    description: ''
  -
    name: Places
    description: ''
  -
    name: Home
    description: ''
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'الـ token بيرجع من <code>POST /auth/register</code> أو <code>POST /auth/login</code>. الـ endpoints العامة بتشتغل من غيره، ولو بعتّه بيتفعّل <code>is_saved</code>.'
security:
  -
    default: []
paths:
  /api/v1/auth/register:
    post:
      summary: 'POST /auth/register — بيعمل الحساب ويرجّع token، فالمستخدم يدخل على طول.'
      operationId: pOSTauthregisterToken
      description: ''
      parameters:
        -
          in: header
          name: Accept-Language
          description: ''
          example: ar
          schema:
            type: string
      responses: {  }
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'value لازم يكون 2 حروف على الأقل. value لازم يكون أقل من 50 حرف.'
                  example: b
                email:
                  type: string
                  description: 'اكتب إيميل صحيح. value لازم يكون أقل من 255 حرف.'
                  example: zbailey@example.net
                password:
                  type: string
                  description: ''
                  example: '|]|{+-'
                terms_accepted:
                  type: boolean
                  description: 'Must be accepted.'
                  example: true
              required:
                - name
                - email
                - password
                - terms_accepted
      security: []
  /api/v1/auth/login:
    post:
      summary: 'POST /auth/login — رسالة واحدة للإيميل والباسورد الغلط (ما نقولش إن الإيميل مش موجود).'
      operationId: pOSTauthlogin
      description: '5 محاولات في الدقيقة لكل IP + إيميل (limiter `auth`).'
      parameters:
        -
          in: header
          name: Accept-Language
          description: ''
          example: ar
          schema:
            type: string
      responses: {  }
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'اكتب إيميل صحيح.'
                  example: gbailey@example.net
                password:
                  type: string
                  description: ''
                  example: '|]|{+-'
              required:
                - email
                - password
      security: []
  /api/v1/auth/password/forgot:
    post:
      summary: 'Forgot password: send a code'
      operationId: forgotPasswordSendACode
      description: "بيبعت كود 6 أرقام للإيميل (صالح 15 دقيقة، و5 محاولات). **الرد واحد دايماً** سواء الإيميل مسجّل أو لأ،\nعشان ما نكشفش مين عنده حساب. وهو نفسه «ابعت تاني»: لو لسه ما عدّتش 60 ثانية من آخر إرسال بيرجّع نفس\nالرد من غير ما يبعت كود جديد، و`resend_in` هو الباقي بالثواني. الكود الجديد بيلغي القديم.\n\n5 محاولات في الدقيقة لكل IP + إيميل، ولكل خطوة من الـ 3 (forgot وverify وreset) ميزانيتها لوحدها\n(`429 TOO_MANY_REQUESTS` ومعاه هيدر `Retry-After`)."
      parameters:
        -
          in: header
          name: Accept-Language
          description: ''
          example: ar
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    resend_in: 60
                properties:
                  data:
                    type: object
                    properties:
                      resend_in:
                        type: integer
                        example: 60
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'الإيميل اللي هيتبعت له الكود. اكتب إيميل صحيح. value لازم يكون أقل من 255 حرف.'
                  example: user@example.com
              required:
                - email
      security: []
  /api/v1/auth/password/verify:
    post:
      summary: 'Check the code'
      operationId: checkTheCode
      description: "بيتحقق من الكود. لو صح بيرجّع `reset_token` (لمرة واحدة، صالح 10 دقايق) يتبعت مع الباسورد الجديد،\nعشان شاشة الكود تتحقق قبل ما تفتح شاشة الباسورد.\n\nأخطاء (422، والرسالة تحت حقل `code`):\n- `INVALID_CODE`: الكود غلط (أو مفيش كود مطلوب).\n- `CODE_EXPIRED`: الكود انتهت صلاحيته، اطلب كود جديد.\n- `CODE_ATTEMPTS_EXCEEDED`: خلّص الـ 5 محاولات، اطلب كود جديد."
      parameters:
        -
          in: header
          name: Accept-Language
          description: ''
          example: ar
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    reset_token: Zq1...
                    expires_in: 600
                properties:
                  data:
                    type: object
                    properties:
                      reset_token:
                        type: string
                        example: Zq1...
                      expires_in:
                        type: integer
                        example: 600
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'نفس الإيميل اللي اتبعت له الكود. اكتب إيميل صحيح. value لازم يكون أقل من 255 حرف.'
                  example: user@example.com
                code:
                  type: string
                  description: 'الكود 6 أرقام. value لازم يكون 6 أرقام.'
                  example: '482915'
              required:
                - email
                - code
      security: []
  /api/v1/auth/password/reset:
    post:
      summary: 'Set the new password'
      operationId: setTheNewPassword
      description: "بيغيّر الباسورد بالـ `reset_token` (مرة واحدة). **كل الـ tokens القديمة بتتمسح**، فالمستخدم يدخل\nمن جديد بالباسورد الجديد (`204`). الكود اللي وصل للإيميل بيثبّت إن الإيميل بتاعه، فالحساب بيتأكّد.\n\n- `RESET_TOKEN_INVALID` (422): الـ token غلط أو منتهي أو اتستخدم، ابدأ من أول.\n- أخطاء الباسورد (422 `VALIDATION_ERROR`) تحت حقل `password`."
      parameters:
        -
          in: header
          name: Accept-Language
          description: ''
          example: ar
          schema:
            type: string
      responses:
        204:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example: {  }
                properties: {  }
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'الإيميل. اكتب إيميل صحيح. value لازم يكون أقل من 255 حرف.'
                  example: user@example.com
                reset_token:
                  type: string
                  description: 'الـ `reset_token` اللي رجع من `POST /auth/password/verify` (لمرة واحدة، 10 دقايق).'
                  example: k3Jx...
                password:
                  type: string
                  description: 'الباسورد الجديد: 8 حروف على الأقل وفيه حرف ورقم.'
                  example: newpass123
              required:
                - email
                - reset_token
                - password
      security: []
  /api/v1/auth/logout:
    post:
      summary: 'POST /auth/logout — بيمسح الـ token الحالي بس (باقي أجهزة المستخدم تفضل شغالة).'
      operationId: pOSTauthlogoutToken
      description: ''
      parameters:
        -
          in: header
          name: Accept-Language
          description: ''
          example: ar
          schema:
            type: string
      responses: {  }
      tags:
        - Auth
  /api/v1/auth/me:
    get:
      summary: 'GET /auth/me'
      operationId: gETauthme
      description: ''
      parameters:
        -
          in: header
          name: Accept-Language
          description: ''
          example: ar
          schema:
            type: string
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'سجّل الدخول عشان تكمّل.'
                  code: UNAUTHENTICATED
                properties:
                  message:
                    type: string
                    example: 'سجّل الدخول عشان تكمّل.'
                  code:
                    type: string
                    example: UNAUTHENTICATED
      tags:
        - Auth
  /api/v1/auth/email/resend:
    post:
      summary: 'Send the verification code'
      operationId: sendTheVerificationCode
      description: "بيبعت كود 6 أرقام لإيميل الحساب (صالح 15 دقيقة، و5 محاولات). هو نفسه «ابعت تاني»: بعد 60 ثانية من\nآخر إرسال بس، قبلها `429 TOO_MANY_REQUESTS` ومعاه هيدر `Retry-After` بالثواني. الكود الجديد بيلغي القديم.\nلو الإيميل متأكّد خلاص: `422 EMAIL_ALREADY_VERIFIED`. وفوق ده 5 طلبات في الدقيقة لكل مستخدم\n(`429 TOO_MANY_REQUESTS`)."
      parameters:
        -
          in: header
          name: Accept-Language
          description: ''
          example: ar
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    resend_in: 60
                properties:
                  data:
                    type: object
                    properties:
                      resend_in:
                        type: integer
                        example: 60
      tags:
        - Auth
  /api/v1/auth/email/verify:
    post:
      summary: 'Verify the email'
      operationId: verifyTheEmail
      description: "بيتحقق من الكود وبيأكّد الإيميل. بيرجّع المستخدم (`email_verified: true`). لو الإيميل متأكّد قبل كده\nبيرجّع المستخدم من غير ما يعمل حاجة.\n\nأخطاء (422، تحت حقل `code`): `INVALID_CODE` و`CODE_EXPIRED` و`CODE_ATTEMPTS_EXCEEDED`.\n5 طلبات في الدقيقة لكل مستخدم (`429 TOO_MANY_REQUESTS`)."
      parameters:
        -
          in: header
          name: Accept-Language
          description: ''
          example: ar
          schema:
            type: string
      responses: {  }
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  description: 'الكود 6 أرقام اللي اتبعت لإيميل الحساب. value لازم يكون 6 أرقام.'
                  example: '482915'
              required:
                - code
  /api/v1/config:
    get:
      summary: 'App config'
      operationId: appConfig
      description: "إعدادات التطبيق من جدول `settings`: الحد الأدنى لنسخة التطبيق، تواريخ رمضان، روابط الشروط والخصوصية،\nبيانات الدعم وحدود فئات السعر. عام ومن غير token، والتطبيق بيطلبه عند الفتح وبيخزّنه.\n\nالقيمة اللي مش متحددة بترجع `null` (مثلاً رقم واتساب الدعم لحد ما يبقى فيه رقم). بيتخزن في cache 5 دقايق."
      parameters:
        -
          in: header
          name: Accept-Language
          description: ''
          example: ar
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    min_app_version:
                      ios: 1.0.0
                      android: 1.0.0
                    ramadan:
                      starts_at: '2027-02-08'
                      ends_at: '2027-03-09'
                    terms_version: 2026-10
                    terms_url: 'https://wain.app/terms'
                    privacy_url: 'https://wain.app/privacy'
                    support:
                      whatsapp: null
                      email: support@wain.app
                    price_ranges:
                      budget_max: 250
                      mid_max: 600
                properties:
                  data:
                    type: object
                    properties:
                      min_app_version:
                        type: object
                        properties:
                          ios:
                            type: string
                            example: 1.0.0
                          android:
                            type: string
                            example: 1.0.0
                      ramadan:
                        type: object
                        properties:
                          starts_at:
                            type: string
                            example: '2027-02-08'
                          ends_at:
                            type: string
                            example: '2027-03-09'
                      terms_version:
                        type: string
                        example: 2026-10
                      terms_url:
                        type: string
                        example: 'https://wain.app/terms'
                      privacy_url:
                        type: string
                        example: 'https://wain.app/privacy'
                      support:
                        type: object
                        properties:
                          whatsapp:
                            type: string
                            example: null
                            nullable: true
                          email:
                            type: string
                            example: support@wain.app
                      price_ranges:
                        type: object
                        properties:
                          budget_max:
                            type: integer
                            example: 250
                          mid_max:
                            type: integer
                            example: 600
      tags:
        - Config
      security: []
  /api/v1/categories:
    get:
      summary: 'List categories'
      operationId: listCategories
      description: "قائمة التصنيفات. التصنيفات الظاهرة بالترتيب اللي حدده الأدمن (A2): شريط الرئيسية وألوان الـ pins على الخريطة.\nالتصنيف المخفي ما بيرجعش. الـ `slug` ما بيتغيرش، فالتطبيق بيفلتر بيه. بيتخزن في cache ساعة وبيتمسح مع\nأي تعديل من اللوحة."
      parameters:
        -
          in: header
          name: Accept-Language
          description: ''
          example: ar
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      slug: cafes
                      name: كافيهات
                      icon: ☕
                      color: '#6F4E37'
                    -
                      slug: restaurants
                      name: مطاعم
                      icon: 🍽️
                      color: '#E8593C'
                properties:
                  data:
                    type: array
                    example:
                      -
                        slug: cafes
                        name: كافيهات
                        icon: ☕
                        color: '#6F4E37'
                      -
                        slug: restaurants
                        name: مطاعم
                        icon: 🍽️
                        color: '#E8593C'
                    items:
                      type: object
                      properties:
                        slug:
                          type: string
                          example: cafes
                        name:
                          type: string
                          example: كافيهات
                        icon:
                          type: string
                          example: ☕
                        color:
                          type: string
                          example: '#6F4E37'
      tags:
        - Categories
      security: []
  /api/v1/attributes:
    get:
      summary: 'List attributes'
      operationId: listAttributes
      description: "الخصائص الفعّالة (واي فاي، هادي...) مجمّعة حسب المجموعة بترتيب العرض: الجو، الخدمات، مناسب لـ، المكان.\nالمجموعة الفاضية ما بترجعش، والخاصية المخفية ما بترجعش.\n\n- `is_filterable`: تظهر في شاشة الفلاتر (S33).\n- `is_quick_filter`: تظهر كـ chip سريعة تحت خانة البحث (أقصى 6).\n- الخصائص كلها (حتى اللي مش `is_filterable`) تنفع في تقييم المكان.\n\nبيتخزن في cache ساعة وبيتمسح مع أي تعديل من اللوحة. اللغة من `Accept-Language`."
      parameters:
        -
          in: header
          name: Accept-Language
          description: ''
          example: ar
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      key: vibe
                      name: الجو
                      items:
                        -
                          slug: quiet
                          name: هادي
                          icon: 🤫
                          is_filterable: true
                          is_quick_filter: true
                    -
                      key: services
                      name: الخدمات
                      items:
                        -
                          slug: wifi
                          name: 'واي فاي'
                          icon: 📶
                          is_filterable: true
                          is_quick_filter: true
                properties:
                  data:
                    type: array
                    example:
                      -
                        key: vibe
                        name: الجو
                        items:
                          -
                            slug: quiet
                            name: هادي
                            icon: 🤫
                            is_filterable: true
                            is_quick_filter: true
                      -
                        key: services
                        name: الخدمات
                        items:
                          -
                            slug: wifi
                            name: 'واي فاي'
                            icon: 📶
                            is_filterable: true
                            is_quick_filter: true
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                          example: vibe
                        name:
                          type: string
                          example: الجو
                        items:
                          type: array
                          example:
                            -
                              slug: quiet
                              name: هادي
                              icon: 🤫
                              is_filterable: true
                              is_quick_filter: true
                          items:
                            type: object
                            properties:
                              slug:
                                type: string
                                example: quiet
                              name:
                                type: string
                                example: هادي
                              icon:
                                type: string
                                example: 🤫
                              is_filterable:
                                type: boolean
                                example: true
                              is_quick_filter:
                                type: boolean
                                example: true
      tags:
        - Attributes
      security: []
  /api/v1/areas:
    get:
      summary: 'List areas'
      operationId: listAreas
      description: "المناطق المتاحة للمستخدمين (المنطقة والمدينة الفعّالتين) بترتيب المدينة ثم المنطقة، ومعاها عدد الأماكن\nالمنشورة. شاشة اختيار المنطقة (S04 وS21) بتستخدمه، والتطبيق بيحسب أقرب منطقة من `center`.\nالـ `slug` هو قيمة بارامتر `area` في `GET /places`.\n\nبيتخزن في cache ساعة وبيتمسح مع أي تعديل في المناطق أو المدن. عدد الأماكن ممكن يتأخر لحد ساعة."
      parameters:
        -
          in: header
          name: Accept-Language
          description: ''
          example: ar
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      slug: new-cairo
                      name: 'التجمع الخامس'
                      city:
                        slug: cairo
                        name: القاهرة
                      center:
                        lat: 30.03
                        lng: 31.47
                      places_count: 26
                properties:
                  data:
                    type: array
                    example:
                      -
                        slug: new-cairo
                        name: 'التجمع الخامس'
                        city:
                          slug: cairo
                          name: القاهرة
                        center:
                          lat: 30.03
                          lng: 31.47
                        places_count: 26
                    items:
                      type: object
                      properties:
                        slug:
                          type: string
                          example: new-cairo
                        name:
                          type: string
                          example: 'التجمع الخامس'
                        city:
                          type: object
                          properties:
                            slug:
                              type: string
                              example: cairo
                            name:
                              type: string
                              example: القاهرة
                        center:
                          type: object
                          properties:
                            lat:
                              type: number
                              example: 30.03
                            lng:
                              type: number
                              example: 31.47
                        places_count:
                          type: integer
                          example: 26
      tags:
        - Areas
      security: []
  /api/v1/places:
    get:
      summary: 'GET /places — القائمة بكروت المكان مع pagination (06 القسم 1: `data` و`meta` من 4 حقول).'
      operationId: gETplacesPagination061datameta4
      description: "بترجّع المنشور بس، بالفلاتر (المنطقة والتصنيفات والخصائص والسعر والتقييم و open_now) من\nPlaceFilterRequest، والـ cache مع /home (أسبوع 8)."
      parameters:
        -
          in: query
          name: area
          description: 'slug المنطقة (من `GET /areas`). Must match an existing stored value.'
          example: new-cairo
          required: false
          schema:
            type: string
            description: 'slug المنطقة (من `GET /areas`). Must match an existing stored value.'
            example: new-cairo
            nullable: true
        -
          in: query
          name: categories
          description: 'Must match an existing stored value.'
          example:
            - architecto
          required: false
          schema:
            type: array
            description: 'Must match an existing stored value.'
            example:
              - architecto
            items:
              type: string
        -
          in: query
          name: attributes
          description: 'Must match an existing stored value.'
          example:
            - architecto
          required: false
          schema:
            type: array
            description: 'Must match an existing stored value.'
            example:
              - architecto
            items:
              type: string
        -
          in: query
          name: price_min
          description: 'أقل سعر فرد بالجنيه. المكان يظهر لو نطاق سعره بيتقاطع مع النطاق المختار. value لازم يكون 0 أو أكتر. value لازم يكون 100000 أو أقل.'
          example: 100
          required: false
          schema:
            type: integer
