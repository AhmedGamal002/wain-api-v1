                    description: 'كافيه هادي بإضاءة دافية ومساحات شغل واسعة، قهوة مختصة وحلويات بيتي. مناسب للمذاكرة والشغل بالساعات.'
                    address: 'شارع التسعين الشمالي، التجمع الخامس'
