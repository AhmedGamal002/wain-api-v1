  /api/v1/search:
    get:
      summary: 'Search places'
      operationId: searchPlaces
      description: "بحث في الأماكن المنشورة بنفس شكل كارت `GET /places` ونفس فلاتر F5 (المنطقة والتصنيفات والخصائص\nوالسعر والتقييم و`open_now`) والترتيب و`lat`/`lng` والـ pagination، وكلها بتتطبّق في نفس الاستعلام.\n\n- **التطبيع:** `أ إ آ` = `ا`، و`ة` = `ه`، و`ى` = `ي`، من غير تشكيل ولا «ال» التعريف.\n- **المرادفات:** كوفي = كافيه = cafe = coffee، وروف = roof = rooftop، وشيشة = shisha (قاموس في الـ repo).\n- **الفرانكو:** بيتطابق بالـ `search_aliases` اللي الأدمن بيضيفها للمكان وبقاموس المرادفات.\n- **الكلمات:** كل كلمة لازم تكون موجودة (AND). الاسم أول، بعده الـ alias، بعده الباقي.\n- **التصحيح الإملائي:** لو النتايج أقل من 3 بتتصحّح الكلمات الغلط، و`meta.corrected_query` بيرجع بالكلمة\n  اللي اتبحث بيها فعلاً (`null` لو ما اتصحّحش حاجة). الموبايل بيعرض «نتايج لـ …».\n- **الترتيب:** `sort=recommended` (الافتراضي) بيرتّب بالتطابق الأول ثم بالترتيب المقترح، والباقي (`nearest`\n  و`rating` و`newest`) بترتيبها زي القائمة.\n- علامات الترقيم بس (أو كلمة من غير حروف) بترجّع قايمة فاضية مش خطأ.\n- **`log=1`:** بيسجّل العملية في سجل البحث (الكلمة مطبَّعة والمنطقة وعدد النتايج والمستخدم والجهاز) لتقارير\n  «أكتر بحث» و«بحث من غير نتائج». الموبايل بيبعتها لما المستخدم يدوس Enter أو يفتح نتيجة أو تثبت شاشة «مفيش\n  نتائج» لثانية بس. السجل بيتمسح بعد 90 يوم."
      parameters:
        -
          in: query
          name: q
          description: 'كلمة البحث، من حرفين لـ 60 حرف. بيتطبّع (أ إ آ = ا، ة = ه، ى = ي، من غير تشكيل) وبيتوسّع بالمرادفات (كوفي = كافيه = coffee)، وبيدوّر في الاسمين والـ aliases والتصنيف والخصائص والمنطقة والوصف. value لازم يكون 2 حروف على الأقل. value لازم يكون أقل من 60 حرف.'
          example: 'كافيه هادي'
          required: true
          schema:
            type: string
            description: 'كلمة البحث، من حرفين لـ 60 حرف. بيتطبّع (أ إ آ = ا، ة = ه، ى = ي، من غير تشكيل) وبيتوسّع بالمرادفات (كوفي = كافيه = coffee)، وبيدوّر في الاسمين والـ aliases والتصنيف والخصائص والمنطقة والوصف. value لازم يكون 2 حروف على الأقل. value لازم يكون أقل من 60 حرف.'
            example: 'كافيه هادي'
        -
          in: query
          name: log
          description: 'سجّل العملية دي في سجل البحث (للتقارير). الموبايل بيبعتها `1` بس لما المستخدم يدوس Enter أو يفتح نتيجة أو تثبت شاشة «مفيش نتائج» لثانية، مش مع كل حرف.'
          example: false
          required: false
          schema:
            type: boolean
            description: 'سجّل العملية دي في سجل البحث (للتقارير). الموبايل بيبعتها `1` بس لما المستخدم يدوس Enter أو يفتح نتيجة أو تثبت شاشة «مفيش نتائج» لثانية، مش مع كل حرف.'
            example: false
            nullable: true
        -
          in: query
          name: area
          description: 'slug المنطقة (من `GET /areas`). Must match an existing stored value.'
          example: new-cairo
          required: false
          schema:
            type: string
            description: 'slug المنطقة (من `GET /areas`). Must match an existing stored value.'
            example: new-cairo
            nullable: true
        -
