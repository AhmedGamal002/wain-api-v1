name: Home
description: ''
endpoints:
  -
    custom: []
    httpMethods:
      - GET
    uri: api/v1/home
    metadata:
      custom: []
      groupName: Home
      groupDescription: ''
      subgroup: ''
      subgroupDescription: ''
      title: Home
      description: |-
        الرئيسية في request واحد (F3): المجموعات المنتقاة للمنطقة و«قريب منك». التصنيفات والفلاتر وقايمة «كل
        الأماكن» مش هنا: شريط التصنيفات من `GET /categories` والقايمة من `GET /places` بالتحميل المستمر.

        - **`collections`:** المجموعات الظاهرة للمنطقة (A5). بعد الإطلاق (P6)، فبترجع قايمة فاضية لحد ما A5
          يتعمل، والموبايل بيخفي الجزء ده لو فاضي.
        - **`nearby`:** لحد 10 أماكن منشورة جوه 30 كم من `lat`/`lng` بالأقرب أول، بنفس كارت `GET /places` ومعاه
          `distance_km`. قايمة فاضية من غير `lat`/`lng` (الموبايل بيخفي «قريب منك» بالكامل لو الموقع مش متاح).
        - `is_saved` و`distance_km` و`is_open_now` بتتحسب مع كل طلب (مش في cache).
        - `area` لازم تكون منطقة فعّالة؛ غير كده 422 والموبايل بيطلب اختيار منطقة تاني.
      authenticated: false
      deprecated: false
    headers:
      Content-Type: application/json
      Accept: application/json
      Accept-Language: ar
    urlParameters: []
    cleanUrlParameters: []
    queryParameters:
      area:
        custom: []
        name: area
        description: 'slug المنطقة اللي المستخدم اختارها (من `GET /areas`). Must match an existing stored value.'
        required: true
        example: new-cairo
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      lat:
        custom: []
        name: lat
        description: 'خط العرض. من غيره (ومن غير `lng`) `nearby` بيرجع قايمة فاضية. This field is required when <code>lng</code> is present. value لازم يكون بين -90 و90.'
        required: false
        example: 30.03
        type: number
        enumValues: []
        exampleWasSpecified: false
        nullable: true
        deprecated: false
      lng:
        custom: []
        name: lng
        description: 'خط الطول. لازم مع `lat`. This field is required when <code>lat</code> is present. value لازم يكون بين -180 و180.'
        required: false
        example: 31.47
        type: number
        enumValues: []
        exampleWasSpecified: false
        nullable: true
        deprecated: false
    cleanQueryParameters:
      area: new-cairo
      lat: 30.03
      lng: 31.47
    bodyParameters: []
    cleanBodyParameters: []
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: '{"data": {"collections": [], "nearby": []}}'
        headers: []
        description: ''
    responseFields: []
    auth: []
    controller: null
    method: null
    route: null
